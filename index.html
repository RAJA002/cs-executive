<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CS Executive Master Portal</title>
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #111827;
      --accent: #38bdf8;
      --danger: #ef4444;
      --warning: #f59e0b;
      --success: #10b981;
      --text: #f9fafc;
      --subtext: #9ca3af;
      --border: #1f2937;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .wrapper { width: 100%; max-width: 700px; display: none; }
    
    /* Lock Screen Overlay */
    #lock-screen {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 999;
    }
    .lock-box {
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 30px;
      border-radius: 12px;
      text-align: center;
      max-width: 350px;
      width: 90%;
    }
    .pin-input {
      width: 80%;
      padding: 12px;
      margin: 15px 0;
      font-size: 1.2rem;
      text-align: center;
      background: #1f2937;
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 6px;
    }

    /* Portal UI */
    h1 { color: var(--accent); margin-bottom: 5px; font-size: 1.6rem; }
    .alarm-box {
      border-radius: 8px;
      padding: 15px;
      margin: 15px 0 25px 0;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 12px;
      border: 1px solid transparent;
    }
    .alarm-danger { background: rgba(239, 68, 68, 0.15); border-color: var(--danger); color: #fca5a5; }
    .alarm-success { background: rgba(16, 185, 129, 0.15); border-color: var(--success); color: #6ee7b7; }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 25px;
    }
    .stat-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 15px;
      border-radius: 8px;
      text-align: center;
    }
    .stat-val { font-size: 1.5rem; font-weight: bold; color: var(--accent); }
    .stat-lbl { font-size: 0.75rem; color: var(--subtext); text-transform: uppercase; margin-top: 4px; }

    .exam-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
    }
    .timer-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
      margin-bottom: 15px;
    }
    .timer { font-family: monospace; font-size: 1.2rem; color: var(--warning); font-weight: bold; }
    
    .question { font-size: 1.1rem; margin-bottom: 20px; line-height: 1.4; }
    .options { display: flex; flex-direction: column; gap: 10px; }
    .opt-btn {
      background: #1f2937;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 12px;
      border-radius: 6px;
      text-align: left;
      cursor: pointer;
      font-size: 0.95rem;
    }
    .opt-btn:hover { background: #374151; }
    
    .btn-action {
      background: var(--accent);
      color: #000;
      font-weight: bold;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 15px;
      float: right;
    }
  </style>
</head>
<body>

  <!-- AUTH LOCK SCREEN -->
  <div id="lock-screen">
    <div class="lock-box">
      <h2 style="margin-top:0; color:var(--accent);">Private Access</h2>
      <p style="color:var(--subtext); font-size:0.9rem;">Enter the passcode to unlock the CS Executive Hub.</p>
      <input type="password" id="pin-entry" class="pin-input" placeholder="••••" maxlength="6">
      <button class="btn-action" style="float:none; width:100%;" onclick="unlockPortal()">Unlock Portal</button>
    </div>
  </div>

  <!-- MAIN APP CONTAINER -->
  <div class="wrapper" id="app-wrapper">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <h1>CS Executive Revision Hub</h1>
    </div>

    <!-- ALARM BANNER -->
    <div id="alarm-banner" class="alarm-box alarm-success">
      ⚠️ <span id="alarm-text">Complete section questions below to track passing status.</span>
    </div>

    <!-- DASHBOARD METRICS -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-val" id="stat-attempted">0</div>
        <div class="stat-lbl">Attempted</div>
      </div>
      <div class="stat-card">
        <div class="stat-val" id="stat-accuracy">0%</div>
        <div class="stat-lbl">Accuracy</div>
      </div>
      <div class="stat-card">
        <div class="stat-val" id="stat-status">ACTIVE</div>
        <div class="stat-lbl">ICSI Target</div>
      </div>
    </div>

    <!-- EXAM INTERFACE -->
    <div class="exam-card">
      <div class="timer-bar">
        <span style="font-size: 0.85rem; color: var(--subtext)" id="paper-tag">COMPANY LAW</span>
        <div class="timer" id="timer-display">03:00</div>
      </div>

      <div class="question" id="q-text">Loading question...</div>
      <div class="options" id="opt-container"></div>

      <div style="clear: both; overflow: hidden;">
        <button class="btn-action" id="next-btn" onclick="submitAnswer()" style="display:none;">Next Question →</button>
      </div>
    </div>
  </div>

<script>
  // CHANGE ACCESS PASSCODE HERE
  const SECRET_PIN = "2026";

  const questions = [
    {
      paper: "Company Law",
      q: "Under Section 135 of the Companies Act 2013, what percentage of average net profits of preceding 3 financial years must be spent on CSR?",
      opts: ["1%", "2%", "3%", "5%"],
      ans: 1
    },
    {
      paper: "Jurisprudence (JIGL)",
      q: "Under the Limitation Act 1963, what is the limitation period for filing a suit relating to accounts or contracts?",
      opts: ["1 Year", "3 Years", "5 Years", "12 Years"],
      ans: 1
    },
    {
      paper: "Tax Laws",
      q: "What is the threshold limit for mandatory GST Registration for a standard service provider?",
      opts: ["₹10 Lakhs", "₹20 Lakhs", "₹40 Lakhs", "₹50 Lakhs"],
      ans: 1
    }
  ];

  let storage = JSON.parse(localStorage.getItem('cs_exec_portal')) || { attempted: 0, correct: 0 };
  let qIndex = 0, selectedOpt = null, timerSeconds = 180, timerInterval;

  function unlockPortal() {
    const input = document.getElementById('pin-entry').value;
    if (input === SECRET_PIN) {
      document.getElementById('lock-screen').style.display = 'none';
      document.getElementById('app-wrapper').style.display = 'block';
      initApp();
    } else {
      alert("Incorrect PIN code.");
    }
  }

  function initApp() {
    renderQuestion();
    startTimer();
    updateDashboard();
  }

  function startTimer() {
    clearInterval(timerInterval);
    timerInterval = setInterval(() => {
      if(timerSeconds <= 0) {
        clearInterval(timerInterval);
        alert("🚨 Time limit exceeded for this question!");
        submitAnswer(true);
      } else {
        timerSeconds--;
        let m = Math.floor(timerSeconds / 60);
        let s = timerSeconds % 60;
        document.getElementById('timer-display').innerText = 
          `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
      }
    }, 1000);
  }

  function renderQuestion() {
    selectedOpt = null;
    document.getElementById('next-btn').style.display = 'none';
    const curr = questions[qIndex];
    document.getElementById('paper-tag').innerText = curr.paper.toUpperCase();
    document.getElementById('q-text').innerText = curr.q;
    
    const container = document.getElementById('opt-container');
    container.innerHTML = '';
    curr.opts.forEach((opt, idx) => {
      const btn = document.createElement('button');
      btn.className = 'opt-btn';
      btn.innerText = opt;
      btn.onclick = () => {
        document.querySelectorAll('.opt-btn').forEach(b => b.style.borderColor = 'var(--border)');
        btn.style.borderColor = 'var(--accent)';
        selectedOpt = idx;
        document.getElementById('next-btn').style.display = 'block';
      };
      container.appendChild(btn);
    });
  }

  function submitAnswer(forcedFail = false) {
    const curr = questions[qIndex];
    const isCorrect = !forcedFail && (selectedOpt === curr.ans);
    storage.attempted += 1;
    if(isCorrect) storage.correct += 1;

    localStorage.setItem('cs_exec_portal', JSON.stringify(storage));
    updateDashboard();

    qIndex = (qIndex + 1) % questions.length;
    timerSeconds = 180;
    renderQuestion();
  }

  function updateDashboard() {
    document.getElementById('stat-attempted').innerText = storage.attempted;
    let acc = storage.attempted > 0 ? Math.round((storage.correct / storage.attempted) * 100) : 0;
    document.getElementById('stat-accuracy').innerText = acc + '%';

    const alarmBanner = document.getElementById('alarm-banner');
    const alarmText = document.getElementById('alarm-text');
    const statStatus = document.getElementById('stat-status');

    if (storage.attempted >= 3 && acc < 50) {
      alarmBanner.className = 'alarm-box alarm-danger';
      alarmText.innerText = "🚨 ALARM: Current accuracy is " + acc + "%. This is below the mandatory ICSI 50% passing threshold!";
      statStatus.innerText = "FAIL RISK";
      statStatus.style.color = "var(--danger)";
    } else if (storage.attempted >= 3 && acc >= 50) {
      alarmBanner.className = 'alarm-box alarm-success';
      alarmText.innerText = "🟢 PASSING: Current performance meets ICSI aggregate standards.";
      statStatus.innerText = "ON TRACK";
      statStatus.style.color = "var(--success)";
    }
  }
</script>
</body>
</html>
