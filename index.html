<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ICSI CS Executive - Dashboard</title>
  <link rel="icon" href="data:,">
  <style>
    :root {
      --primary: #6366f1;
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --subtext: #94a3b8;
      --border: #334155;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
    }

    /* Top Bar Header */
    header {
      background: var(--card-bg);
      padding: 14px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Top Left: Logo Home Button */
    .logo-container {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: white;
    }

    .icsi-badge {
      background: #1e40af;
      color: #ffffff;
      font-weight: 800;
      font-size: 0.95rem;
      padding: 6px 12px;
      border-radius: 6px;
      letter-spacing: 1px;
    }

    /* Top Middle: Syllabus Nav Button */
    .nav-btn {
      background: var(--primary);
      color: white;
      text-decoration: none;
      padding: 8px 20px;
      border-radius: 6px;
      font-weight: bold;
      transition: opacity 0.2s;
    }

    .nav-btn:hover { opacity: 0.9; }

    /* Top Right: Countdown Timer */
    .timer-text {
      font-size: 1.15rem;
      font-weight: 700;
      color: #38bdf8;
    }

    main {
      padding: 60px 20px;
      text-align: center;
      max-width: 800px;
      margin: 0 auto;
    }

    .welcome-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 40px;
      border-radius: 12px;
    }
  </style>
</head>
<body>

  <header>
    <!-- Top Left: Logo / Home Link -->
    <a href="index.html" class="logo-container" title="Home">
      <span class="icsi-badge">ICSI</span>
      <span style="font-weight: bold; font-size: 1.1rem;">CS Executive</span>
    </a>

    <!-- Top Middle: Syllabus Nav Link -->
    <a href="syllabus.html" class="nav-btn">Syllabus</a>

    <!-- Top Right: Exam Countdown -->
    <div id="timer" class="timer-text">Loading Exam Countdown...</div>
  </header>

  <main>
    <div class="welcome-card">
      <h2>ICSI CS Executive Study Portal</h2>
      <p style="color:var(--subtext)">Click <strong>Syllabus</strong> in the navigation header to access Group 1 and Group 2 subject materials, past papers, and Companies Act section databases.</p>
    </div>
  </main>

  <script>
    const examDate = new Date("December 21, 2026 09:00:00").getTime();

    function startExamCountdown() {
      setInterval(() => {
        const now = new Date().getTime();
        const distance = examDate - now;
        if (distance < 0) {
          document.getElementById("timer").innerHTML = "Dec 2026 Exam Started";
          return;
        }
        const days = Math.floor(distance / (1000 * 60 * 60 * 24));
        const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((distance % (1000 * 60)) / 1000);
        document.getElementById("timer").innerHTML = `Dec 2026 Exam: ${days}d ${hours}h ${minutes}m ${seconds}s`;
      }, 1000);
    }
    startExamCountdown();
  </script>
</body>
</html>
